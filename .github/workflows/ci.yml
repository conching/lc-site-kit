name: Kit CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: plugins/lc-core/requirements.txt
      - run: pip install -r plugins/lc-core/requirements.txt
      - run: plugins/lc-core/tests/run.sh
      - name: LC Bricks MCP checks
        working-directory: plugins/lc-bricks-mcp
        run: |
          find . -name '*.php' -type f -not -path './vendor/*' -not -path './dist/*' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php bin/check-tool-parity.php
          for test in tests/Unit/*Test.php; do php "$test"; done
          bash -n bin/build-zip.sh
      - run: ./bin/make-audit-bundle.sh /tmp/lc-site-kit-audit.md
      - run: test -s /tmp/lc-site-kit-audit.md
